[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-web"
version = "1.0.0"
description = "FastAPI WebSocket speech-to-text service using OpenAI Whisper"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.128.0", "uvicorn>=0.40.0", "openai-whisper>=20250625", "numpy>=2.3.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
