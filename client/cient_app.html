<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WS Audio Client</title>
</head>
<body>
  <h3>Audio WS Client</h3>
  <button id="btnStart">Start</button>
  <button id="btnStop" disabled>Stop</button>
  <pre id="log"></pre>

<script>
const logEl = document.getElementById("log");
function log(msg){ logEl.textContent += msg + "\n"; }

let ws, audioCtx, processor, source, stream;
let isRunning = false;

// Convierte Float32 [-1..1] a PCM16 little-endian
function floatTo16BitPCM(float32Array) {
  const buffer = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buffer);
  let offset = 0;
  for (let i = 0; i < float32Array.length; i++, offset += 2) {
    let s = Math.max(-1, Math.min(1, float32Array[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buffer;
}

// Downsample a 16kHz (simple, suficiente para MVP)
function downsampleBuffer(buffer, sampleRate, outRate) {
  if (outRate === sampleRate) return buffer;
  const ratio = sampleRate / outRate;
  const newLen = Math.round(buffer.length / ratio);
  const result = new Float32Array(newLen);
  let offsetResult = 0;
  let offsetBuffer = 0;
  while (offsetResult < result.length) {
    const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
    // promedio
    let accum = 0, count = 0;
    for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
      accum += buffer[i]; count++;
    }
    result[offsetResult] = accum / count;
    offsetResult++;
    offsetBuffer = nextOffsetBuffer;
  }
  return result;
}

async function start() {
  const SERVER_WS = "ws://IP_SERVIDOR:8000/ws/audio"; // <- cambia IP o Tailscale IP

  ws = new WebSocket(SERVER_WS);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => log("WS connected");
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "ready") log(`Server ready sr=${msg.sr}`);
      if (msg.type === "transcript") log("TRANSCRIPT: " + msg.text);
      if (msg.type === "error") log("ERROR: " + msg.message);
    } catch {
      log("MSG: " + ev.data);
    }
  };
  ws.onclose = () => log("WS closed");

  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  source = audioCtx.createMediaStreamSource(stream);

  // ScriptProcessor está deprecado pero sirve para MVP; para producción usa AudioWorklet
  processor = audioCtx.createScriptProcessor(4096, 1, 1);

  processor.onaudioprocess = (e) => {
    if (!isRunning || ws.readyState !== 1) return;
    const input = e.inputBuffer.getChannelData(0);
    const down = downsampleBuffer(input, audioCtx.sampleRate, 16000);
    const pcm = floatTo16BitPCM(down);
    ws.send(pcm);
  };

  source.connect(processor);
  processor.connect(audioCtx.destination);

  isRunning = true;
  document.getElementById("btnStart").disabled = true;
  document.getElementById("btnStop").disabled = false;
  log("Recording...");
}

async function stop() {
  isRunning = false;

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: "stop", model: "base" }));
  }

  document.getElementById("btnStart").disabled = false;
  document.getElementById("btnStop").disabled = true;
  log("Stopped (sent stop).");
}

document.getElementById("btnStart").onclick = start;
document.getElementById("btnStop").onclick = stop;
</script>
</body>
</html>
